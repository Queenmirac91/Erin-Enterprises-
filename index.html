<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erin Enterprises | Online Store</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

/* HEADER */
header {
  background: #111;
  color: white;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.cart-button {
  background: #fff;
  color: #111;
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

/* HERO */
.hero {
  background: linear-gradient(135deg, #111, #444);
  color: white;
  text-align: center;
  padding: 55px 20px;
}

.hero h1 {
  font-size: 38px;
  margin-bottom: 12px;
}

.hero p {
  font-size: 17px;
  margin-bottom: 22px;
}

.shop-btn {
  display: inline-block;
  background: white;
  color: #111;
  padding: 13px 25px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

/* PRODUCTS */
.products-section {
  padding: 35px 15px;
  max-width: 1200px;
  margin: auto;
}

.section-title {
  text-align: center;
  margin-bottom: 25px;
  font-size: 28px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 20px;
}

.product {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
}

.product-image {
  width: 100%;
  height: 220px;
  object-fit: cover;
  background: #eee;
}

.product-info {
  padding: 15px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.product h3 {
  font-size: 17px;
  margin-bottom: 8px;
}

.price {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

.add-btn {
  margin-top: auto;
  width: 100%;
  border: none;
  background: #111;
  color: white;
  padding: 11px;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}

.add-btn:hover {
  background: #333;
}

/* CART */
.cart-panel {
  position: fixed;
  top: 0;
  right: -100%;
  width: min(400px, 100%);
  height: 100%;
  background: white;
  z-index: 2000;
  box-shadow: -4px 0 15px rgba(0,0,0,0.2);
  transition: 0.3s;
  padding: 20px;
  overflow-y: auto;
}

.cart-panel.open {
  right: 0;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.close-cart {
  border: none;
  background: #eee;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}

.cart-item {
  border-bottom: 1px solid #ddd;
  padding: 12px 0;
}

.cart-item-name {
  font-weight: bold;
  margin-bottom: 5px;
}

.cart-item-price {
  margin-bottom: 8px;
}

.quantity-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.quantity-controls button {
  width: 30px;
  height: 30px;
  border: none;
  background: #111;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.remove-btn {
  background: #b00020 !important;
}

.cart-total {
  font-size: 21px;
  font-weight: bold;
  margin: 20px 0;
}

.checkout-btn {
  width: 100%;
  background: #25D366;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.empty-cart {
  text-align: center;
  padding: 30px 10px;
  color: #777;
}

/* FOOTER */
footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 30px 15px;
  margin-top: 30px;
}

footer p {
  margin: 7px 0;
}

/* MOBILE */
@media (max-width: 600px) {
  .hero h1 {
    font-size: 30px;
  }

  .products {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .product-image {
    height: 170px;
  }

  .product-info {
    padding: 11px;
  }

  .product h3 {
    font-size: 15px;
  }

  .price {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Erin Enterprises</div>

  <button class="cart-button" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<section class="hero">
  <h1>Welcome to Erin Enterprises</h1>
  <p>Quality products at affordable prices.</p>
  <a href="#products" class="shop-btn">Shop Now</a>

<section class="products-section" id="products">

  <h2 class="section-title">Our Products</h2>

<!-- CART -->
<div class="cart-panel" id="cartPanel">

  </div>

  <div class="cart-total">
    Total: ₦<span id="cartTotal">0</span>
  </div>

  <button class="checkout-btn" onclick="orderOnWhatsApp()">
    Order on WhatsApp

<footer>

  <p>📱 WhatsApp: +234 812 525 3898</p>

let cart = [];


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts() {

  const productList = document.getElementById("productList");

  productList.innerHTML = "";

  products.forEach((product, index) => {

    let imageHTML;

    if (product.image) {

      imageHTML = `
        <img
          src="${product.image}"
          class="product-image"
          alt="${product.name}"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
        >
        <div
          class="product-image"
          style="display:none; align-items:center; justify-content:center; font-weight:bold;"
        >
          Erin Enterprises
        </div>
      `;

    } else {

      imageHTML = `
        <div
          class="product-image"
          style="display:flex; align-items:center; justify-content:center; font-weight:bold;"
        >
          Erin Enterprises
        </div>
      `;

    }

    productList.innerHTML += `

      <div class="product">

        ${imageHTML}

        <div class="product-info">

          <h3>${product.name}</h3>

          <div class="price">
            ₦${product.price.toLocaleString()}
          </div>

          <button
            class="add-btn"
            onclick="addToCart(${index})"
          >
            Add to Cart
          </button>

        </div>

      </div>

    `;

  });

}


/* =========================
   ADD TO CART
========================= */

function addToCart(index) {

  const product = products[index];

  const existing = cart.find(
    item => item.name === product.name
  );

  if (existing) {

    existing.quantity++;

  } else {

    cart.push({
      name: product.name,
      price: product.price,
      quantity: 1
    });

  }

  updateCart();

  openCart();

}


/* =========================
   UPDATE CART
========================= */

function updateCart() {

  const cartItems = document.getElementById("cartItems");

  const cartCount = document.getElementById("cartCount");

  const cartTotal = document.getElementById("cartTotal");

  cartItems.innerHTML = "";

  let total = 0;

  let count = 0;

  if (cart.length === 0) {

    cartItems.innerHTML = `
      <div class="empty-cart">
        Your cart is empty.
      </div>
    `;

  }

  cart.forEach((item, index) => {

    total += item.price * item.quantity;

    count += item.quantity;

    cartItems.innerHTML += `

      <div class="cart-item">

        <div class="cart-item-name">
          ${item.name}
        </div>

        <div class="cart-item-price">
          ₦${item.price.toLocaleString()}
        </div>

        <div class="quantity-controls">

          <button onclick="decreaseQuantity(${index})">
            −
          </button>

          <span>${item.quantity}</span>

          <button onclick="increaseQuantity(${index})">
            +
          </button>

          <button
            class="remove-btn"
            onclick="removeFromCart(${index})"
          >
            Remove
          </button>

        </div>

      </div>

    `;

  });

  cartCount.textContent = count;

  cartTotal.textContent = total.toLocaleString();

}


/* =========================
   INCREASE QUANTITY
========================= */

function increaseQuantity(index) {

  cart[index].quantity++;

  updateCart();

}


/* =========================
   DECREASE QUANTITY
========================= */

function decreaseQuantity(index) {

  if (cart[index].quantity > 1) {

    cart[index].quantity--;

  } else {

    cart.splice(index, 1);

  }

  updateCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeFromCart(index) {

  cart.splice(index, 1);

  updateCart();

}


/* =========================
   OPEN CART
========================= */

function openCart() {

  document
    .getElementById("cartPanel")
    .classList.add("open");

}


/* =========================
   CLOSE CART
========================= */

function closeCart() {

  document
    .getElementById("cartPanel")
    .classList.remove("open");

}


/* =========================
   WHATSAPP ORDER
========================= */

function orderOnWhatsApp() {

  if (cart.length === 0) {

    alert("Your cart is empty.");

    return;

  }

  let message =
    "Hello Erin Enterprises! I would like to order:%0A%0A";

  let total = 0;

  cart.forEach(item => {

    const itemTotal =
      item.price * item.quantity;

    total += itemTotal;

    message +=
      "• " +
      item.name +
      " x" +
      item.quantity +
      " — ₦" +
      itemTotal.toLocaleString() +
      "%0A";

  });

  message +=
    "%0ATotal: ₦" +
    total.toLocaleString();

  const whatsappNumber =
    "2348125253898";

  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    message;

  window.open(
    whatsappURL,
    "_blank"
  );

}
