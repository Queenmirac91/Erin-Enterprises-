<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erin Enterprises | Online Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.cart-btn{
  background:#fff;
  color:#111;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111,#444);
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:36px;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 15px;
}

.section-title{
  text-align:center;
  margin-bottom:25px;
  font-size:28px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
}

.product img{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
  background:#eee;
}

.no-image{
  width:100%;
  height:210px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  text-align:center;
  padding:15px;
}

.product-info{
  padding:15px;
}

.product h3{
  font-size:17px;
  margin-bottom:8px;
}

.price{
  color:#111;
  font-weight:bold;
  font-size:18px;
  margin-bottom:12px;
}

.add-btn{
  width:100%;
  padding:11px;
  border:none;
  border-radius:7px;
  background:#111;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.add-btn:hover{
  background:#333;
}

.cart-panel{
  position:fixed;
  right:-400px;
  top:0;
  width:380px;
  max-width:100%;
  height:100%;
  background:white;
  z-index:2000;
  box-shadow:-4px 0 15px rgba(0,0,0,.2);
  transition:.3s;
  padding:20px;
  overflow-y:auto;
}

.cart-panel.open{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close-cart{
  background:#eee;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.cart-item h4{
  margin-bottom:8px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.cart-controls button{
  border:none;
  background:#111;
  color:white;
  width:30px;
  height:30px;
  border-radius:5px;
  cursor:pointer;
}

.remove-btn{
  background:#c00 !important;
  width:auto !important;
  padding:0 8px;
}

.cart-total{
  font-size:21px;
  font-weight:bold;
  margin:20px 0;
}

.whatsapp-btn{
  display:block;
  width:100%;
  text-align:center;
  background:#25D366;
  color:white;
  text-decoration:none;
  border:none;
  padding:14px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.empty-cart{
  text-align:center;
  color:#777;
  padding:30px 0;
}

footer{
  margin-top:40px;
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
}

footer a{
  color:#25D366;
  text-decoration:none;
  font-weight:bold;
}

@media(max-width:500px){
  .hero h1{
    font-size:28px;
  }

  .cart-panel{
    width:100%;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product img,
  .no-image{
    height:170px;
  }

  .product-info{
    padding:10px;
  }

  .product h3{
    font-size:15px;
  }

  .price{
    font-size:16px;
  }
}
</style>
</head>

let cart = [];

function displayProducts(){

  const productsContainer =
    document.getElementById("products");

  productsContainer.innerHTML = "";

  products.forEach((product,index)=>{

    const card = document.createElement("div");
    card.className = "product";

    card.innerHTML = `

      <img
        src="${product.image}"
        alt="${product.name}"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      >

      <div class="no-image" style="display:none;">
        📷 Image unavailable
      </div>

      <div class="product-info">

        <h3>${product.name}</h3>

        <div class="price">
          ₦${product.price.toLocaleString()}
        </div>

        <button
          class="add-btn"
          onclick="addToCart(${index})">
          Add to Cart
        </button>

      </div>
    `;

    productsContainer.appendChild(card);

  });

}

function addToCart(index){

  const existing =
    cart.find(item => item.index === index);

  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      index:index,
      quantity:1
    });

  }

  updateCart();

}

function updateCart(){

  const cartItems =
    document.getElementById("cartItems");

  const cartCount =
    document.getElementById("cartCount");

  const cartTotal =
    document.getElementById("cartTotal");

  cartItems.innerHTML = "";

  let total = 0;
  let count = 0;

  if(cart.length === 0){

    cartItems.innerHTML =
      '<div class="empty-cart">Your cart is empty.</div>';

  }

  cart.forEach((item,cartIndex)=>{

    const product = products[item.index];

    const itemTotal =
      product.price * item.quantity;

    total += itemTotal;
    count += item.quantity;

    const div =
      document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <h4>${product.name}</h4>

      <div>
        ₦${product.price.toLocaleString()} each
      </div>

      <div class="cart-controls">

        <button onclick="changeQuantity(${cartIndex},-1)">
          −
        </button>

        <span>${item.quantity}</span>

        <button onclick="changeQuantity(${cartIndex},1)">
          +
        </button>

        <button
          class="remove-btn"
          onclick="removeFromCart(${cartIndex})">
          Remove
        </button>

      </div>

      <div style="margin-top:8px;font-weight:bold;">
        ₦${itemTotal.toLocaleString()}
      </div>

    `;

    cartItems.appendChild(div);

  });

  cartCount.textContent = count;

  cartTotal.textContent =
    total.toLocaleString();

}

function changeQuantity(cartIndex,change){

  cart[cartIndex].quantity += change;

  if(cart[cartIndex].quantity <= 0){

    cart.splice(cartIndex,1);

  }

  updateCart();

}

function removeFromCart(cartIndex){

  cart.splice(cartIndex,1);

  updateCart();

}

function openCart(){

  document
    .getElementById("cartPanel")
    .classList.add("open");

}

function closeCart(){

  document
    .getElementById("cartPanel")
    .classList.remove("open");

}

function checkoutWhatsApp(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }

  let message =
    "Hello Erin Enterprises! I would like to order:%0A%0A";

  let total = 0;

  cart.forEach(item=>{

    const product =
      products[item.index];

    const itemTotal =
      product.price * item.quantity;

    total += itemTotal;

    message +=
      "• " +
      product.name +
      " x" +
      item.quantity +
      " = ₦" +
      itemTotal.toLocaleString() +
      "%0A";

  });

  message +=
    "%0A*Total: ₦" +
    total.toLocaleString() +
    "*";

  message +=
    "%0A%0APlease confirm my order. Thank you.";

  const whatsappURL =
    "https://wa.me/2348125253898?text=" +
    message;

  window.open(
    whatsappURL,
    "_blank"
  );

}
