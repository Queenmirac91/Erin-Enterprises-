<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erin Enterprises | Online Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.cart-btn{
  background:white;
  color:#111;
  border:none;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.hero{
  background:linear-gradient(135deg,#111,#444);
  color:white;
  text-align:center;
  padding:50px 20px;
}

.hero h1{
  font-size:36px;
  margin-bottom:12px;
}

.hero p{
  font-size:17px;
  margin:7px 0;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 15px;
}

/* SEARCH */

.search-box{
  margin:10px auto 20px;
  max-width:600px;
}

.search-box input{
  width:100%;
  padding:14px 18px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  border-color:#111;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:25px;
}

.category-btn{
  border:none;
  background:white;
  border:1px solid #ddd;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.category-btn.active,
.category-btn:hover{
  background:#111;
  color:white;
}

/* PRODUCTS */

.section-title{
  text-align:center;
  margin-bottom:20px;
  font-size:28px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
  transition:.2s;
}

.product:hover{
  transform:translateY(-3px);
}

.product img{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
  background:#eee;
}

.no-image{
  width:100%;
  height:210px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
}

.product-info{
  padding:15px;
}

.product h3{
  font-size:17px;
  margin-bottom:6px;
}

.category-label{
  display:inline-block;
  font-size:12px;
  background:#eee;
  padding:4px 8px;
  border-radius:10px;
  margin-bottom:10px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin-bottom:12px;
}

.product-buttons{
  display:flex;
  gap:8px;
}

.add-btn,
.buy-btn{
  flex:1;
  padding:11px 5px;
  border:none;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn{
  background:#111;
  color:white;
}

.buy-btn{
  background:#25D366;
  color:white;
}

.add-btn:hover{
  background:#333;
}

.buy-btn:hover{
  background:#1ebe5d;
}

.no-results{
  text-align:center;
  padding:40px;
  color:#777;
  display:none;
}

/* CART */

.cart-panel{
  position:fixed;
  right:-430px;
  top:0;
  width:410px;
  max-width:100%;
  height:100%;
  background:white;
  z-index:2000;
  box-shadow:-4px 0 15px rgba(0,0,0,.2);
  transition:.3s;
  padding:20px;
  overflow-y:auto;
}

.cart-panel.open{
  right:0;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close-cart{
  background:#eee;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:15px 0;
}

.cart-item h4{
  margin-bottom:7px;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.cart-controls button{
  border:none;
  background:#111;
  color:white;
  width:30px;
  height:30px;
  border-radius:5px;
  cursor:pointer;
}

.remove-btn{
  background:#c00 !important;
  width:auto !important;
  padding:0 9px;
}

.cart-total{
  font-size:21px;
  font-weight:bold;
  margin:20px 0;
}

/* CUSTOMER FORM */

.customer-form{
  margin-top:20px;
  border-top:1px solid #ddd;
  padding-top:20px;
}

.customer-form h3{
  margin-bottom:12px;
}

.customer-form input,
.customer-form textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
  font-family:Arial,sans-serif;
}

.customer-form textarea{
  min-height:80px;
  resize:vertical;
}

.whatsapp-btn{
  width:100%;
  background:#25D366;
  color:white;
  border:none;
  padding:14px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.empty-cart{
  text-align:center;
  color:#777;
  padding:30px 0;
}

/* FOOTER */

footer{
  margin-top:40px;
  background:#111;
  color:white;
  text-align:center;
  padding:25px 15px;
}

footer p{
  margin:7px;
}

footer a{
  color:#25D366;
  text-decoration:none;
  font-weight:bold;
}

/* MOBILE */

@media(max-width:500px){

  .hero h1{
    font-size:28px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .product img,
  .no-image{
    height:170px;
  }

  .product-info{
    padding:10px;
  }

  .product h3{
    font-size:14px;
  }

  .price{
    font-size:16px;
  }

  .product-buttons{
    flex-direction:column;
  }

  .product-buttons button{
    width:100%;
  }

  .cart-panel{
    width:100%;
  }
}
</style>

/* =========================
   CART
========================= */

let cart = [];

let selectedCategory = "All";


/* =========================
   DISPLAY PRODUCTS
========================= */

function displayProducts(list = products){

  const container =
    document.getElementById("products");

  const noResults =
    document.getElementById("noResults");

  container.innerHTML = "";

  if(list.length === 0){

    noResults.style.display = "block";

    return;

  }

  noResults.style.display = "none";


  list.forEach(product => {

    const index =
      products.indexOf(product);

    const card =
      document.createElement("div");

    card.className = "product";


    card.innerHTML = `

      <img
        src="${product.image}"
        alt="${product.name}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="no-image"
        style="display:none;">
        📷 Image unavailable
      </div>

      <div class="product-info">

        <h3>${product.name}</h3>

        <span class="category-label">
          ${product.category}
        </span>

        <div class="price">
          ₦${product.price.toLocaleString()}
        </div>

        <div class="product-buttons">

          <button
            class="add-btn"
            onclick="addToCart(${index})">
            🛒 Add
          </button>

          <button
            class="buy-btn"
            onclick="buyNow(${index})">
            Buy Now
          </button>

        </div>

      </div>
    `;

    container.appendChild(card);

  });

}


/* =========================
   SEARCH + CATEGORY
========================= */

function filterProducts(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    products.filter(product => {

      const matchesSearch =
        product.name
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        selectedCategory === "All" ||
        product.category === selectedCategory;

      return matchesSearch &&
             matchesCategory;

    });


  displayProducts(filtered);

}


function selectCategory(category,button){

  selectedCategory = category;


  document
    .querySelectorAll(".category-btn")
    .forEach(btn => {

      btn.classList.remove("active");

    });


  button.classList.add("active");

  filterProducts();

}


/* =========================
   ADD TO CART
========================= */

function addToCart(index){

  const existing =
    cart.find(item => item.index === index);


  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      index:index,
      quantity:1
    });

  }


  updateCart();

}


/* =========================
   BUY NOW
========================= */

function buyNow(index){

  const existing =
    cart.find(item => item.index === index);


  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      index:index,
      quantity:1
    });

  }


  updateCart();

  openCart();

}


/* =========================
   UPDATE CART
========================= */

function updateCart(){

  const cartItems =
    document.getElementById("cartItems");

  const cartCount =
    document.getElementById("cartCount");

  const cartTotal =
    document.getElementById("cartTotal");


  cartItems.innerHTML = "";


  let total = 0;
  let count = 0;


  if(cart.length === 0){

    cartItems.innerHTML =
      '<div class="empty-cart">Your cart is empty.</div>';

  }


  cart.forEach((item,cartIndex)=>{

    const product =
      products[item.index];


    const itemTotal =
      product.price * item.quantity;


    total += itemTotal;

    count += item.quantity;


    const div =
      document.createElement("div");


    div.className = "cart-item";


    div.innerHTML = `

      <h4>${product.name}</h4>

      <div>
        ₦${product.price.toLocaleString()} each
      </div>

      <div class="cart-controls">

        <button
          onclick="changeQuantity(${cartIndex},-1)">
          −
        </button>

        <span>
          ${item.quantity}
        </span>

        <button
          onclick="changeQuantity(${cartIndex},1)">
          +
        </button>

        <button
          class="remove-btn"
          onclick="removeFromCart(${cartIndex})">
          Remove
        </button>

      </div>

      <div
        style="margin-top:8px;font-weight:bold;">
        ₦${itemTotal.toLocaleString()}
      </div>

    `;


    cartItems.appendChild(div);

  });


  cartCount.textContent = count;

  cartTotal.textContent =
    total.toLocaleString();

}


/* =========================
   QUANTITY
========================= */

function changeQuantity(cartIndex,change){

  cart[cartIndex].quantity += change;


  if(cart[cartIndex].quantity <= 0){

    cart.splice(cartIndex,1);

  }


  updateCart();

}


/* =========================
   REMOVE
========================= */

function removeFromCart(cartIndex){

  cart.splice(cartIndex,1);

  updateCart();

}


/* =========================
   OPEN CART
========================= */

function openCart(){

  document
    .getElementById("cartPanel")
    .classList.add("open");

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

  document
    .getElementById("cartPanel")
    .classList.remove("open");

}


/* =========================
   WHATSAPP CHECKOUT
========================= */

function checkoutWhatsApp(){

  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();


  if(!name){

    alert("Please enter your name.");

    return;

  }


  if(!phone){

    alert("Please enter your phone number.");

    return;

  }


  if(!address){

    alert("Please enter your delivery address.");

    return;

  }


  let message =
    "Hello Erin Enterprises!%0A%0A";

  message +=
    "*NEW ORDER*%0A%0A";


  message +=
    "*Customer Name:* " +
    encodeURIComponent(name) +
    "%0A";


  message +=
    "*Phone:* " +
    encodeURIComponent(phone) +
    "%0A";


  message +=
    "*Delivery Address:* " +
    encodeURIComponent(address) +
    "%0A%0A";


  message +=
    "*ORDER ITEMS:*%0A";


  let total = 0;


  cart.forEach(item => {

    const product =
      products[item.index];


    const itemTotal =
      product.price * item.quantity;


    total += itemTotal;


    message +=
      "• " +
      encodeURIComponent(product.name) +
      " x" +
      item.quantity +
      " = ₦" +
      itemTotal.toLocaleString() +
      "%0A";

  });


  message +=
    "%0A*TOTAL: ₦" +
    total.toLocaleString() +
    "*";


  message +=
    "%0A%0APlease confirm my order. Thank you.";


  const whatsappURL =
    "https://wa.me/2348125253898?text=" +
    message;


  window.open(
    whatsappURL,
    "_blank"
  );

}
