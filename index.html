<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erin Enterprises | Online Shopping</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f6f6;
  color:#222;
  padding-bottom:75px;
}

header{
  background:#0b6b3a;
  color:white;
  padding:18px 15px 15px;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  max-width:1100px;
  margin:auto;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.cart{
  background:white;
  color:#0b6b3a;
  border:0;
  border-radius:25px;
  padding:9px 14px;
  font-weight:bold;
  cursor:pointer;
}

.search-box{
  max-width:1100px;
  margin:15px auto 0;
  display:flex;
  background:white;
  border-radius:25px;
  overflow:hidden;
}

.search-box input{
  flex:1;
  border:0;
  outline:none;
  padding:13px 16px;
  font-size:15px;
}

.search-box button{
  border:0;
  background:#ffb300;
  padding:0 18px;
  cursor:pointer;
  font-size:18px;
}

nav{
  background:white;
  padding:12px;
  display:flex;
  justify-content:center;
  gap:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  position:sticky;
  top:105px;
  z-index:900;
}

nav a{
  color:#333;
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#0b6b3a,#159957);
  color:white;
  padding:35px 20px;
  text-align:center;
}

.hero h1{
  font-size:30px;
  margin-bottom:10px;
}

.hero p{
  line-height:1.6;
  max-width:600px;
  margin:auto;
}

.shop-btn{
  display:inline-block;
  margin-top:18px;
  background:#ffb300;
  color:#222;
  padding:13px 25px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.section-title{
  font-size:23px;
  margin-bottom:18px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:8px;
}

.category{
  min-width:90px;
  background:white;
  border-radius:12px;
  padding:14px 8px;
  text-align:center;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
  cursor:pointer;
}

.category span{
  display:block;
  font-size:28px;
  margin-bottom:5px;
}

.category small{
  font-weight:bold;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  position:relative;
}

.product-image{
  height:170px;
  background:#edf7f1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

.favorite{
  position:absolute;
  top:8px;
  right:8px;
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:white;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.product-info{
  padding:13px;
}

.product h3{
  font-size:16px;
  margin-bottom:7px;
}

.product-description{
  color:#777;
  font-size:13px;
  line-height:1.4;
  min-height:36px;
}

.price{
  font-size:18px;
  font-weight:bold;
  color:#0b6b3a;
  margin:10px 0;
}

.product-buttons{
  display:flex;
  gap:7px;
}

.add-btn,
.buy-btn{
  flex:1;
  border:0;
  padding:10px 5px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
  font-size:12px;
}

.add-btn{
  background:#e8f5ee;
  color:#0b6b3a;
}

.buy-btn{
  background:#0b6b3a;
  color:white;
}

.deal{
  background:#fff4d6;
  border-radius:14px;
  padding:20px;
  margin-bottom:25px;
  border:1px solid #ffe19a;
}

.deal h2{
  color:#d17b00;
  margin-bottom:7px;
}

.about{
  background:white;
  border-radius:14px;
  padding:25px;
  line-height:1.7;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.contact{
  text-align:center;
}

.contact a{
  color:#0b6b3a;
  font-weight:bold;
  text-decoration:none;
}

footer{
  background:#073d23;
  color:white;
  text-align:center;
  padding:25px 15px;
  margin-top:35px;
  line-height:1.7;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -2px 10px rgba(0,0,0,.15);
  z-index:2000;
}

.bottom-nav a{
  text-decoration:none;
  color:#555;
  text-align:center;
  font-size:12px;
}

.bottom-nav span{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}

.cart-panel{
  display:none;
  position:fixed;
  top:0;
  right:0;
  width:90%;
  max-width:400px;
  height:100%;
  background:white;
  z-index:3000;
  box-shadow:-4px 0 15px rgba(0,0,0,.2);
  padding:20px;
  overflow:auto;
}

.cart-panel.active{
  display:block;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close-cart{
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  cursor:pointer;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.cart-total{
  font-size:20px;
  font-weight:bold;
  margin:20px 0;
}

.checkout{
  display:block;
  text-align:center;
  background:#0b6b3a;
  color:white;
  padding:14px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#777;
  padding:40px 10px;
}

@media(max-width:600px){
  .hero h1{
    font-size:25px;
  }

  nav{
    overflow-x:auto;
    justify-content:flex-start;
    white-space:nowrap;
  }

  .product-image{
    height:145px;
  }
}

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }
}
