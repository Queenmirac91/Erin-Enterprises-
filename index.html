<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erin Enterprises | Online Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.cart-button{
    background:#fff;
    color:#111;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.hero{
    background:linear-gradient(135deg,#111,#444);
    color:white;
    text-align:center;
    padding:55px 20px;
}

.hero h1{
    font-size:38px;
    margin-bottom:12px;
}

.hero p{
    font-size:18px;
    margin-bottom:25px;
}

.shop-button{
    display:inline-block;
    background:#25D366;
    color:white;
    padding:13px 25px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

.section-title{
    text-align:center;
    margin:35px 0 20px;
    font-size:28px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.product{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
    padding-bottom:18px;
}

.product-image{
    width:100%;
    height:210px;
    background:#eee;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#777;
    font-size:14px;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.product-content{
    padding:16px;
}

.product h3{
    margin-bottom:8px;
    font-size:18px;
}

.price{
    font-size:19px;
    font-weight:bold;
    margin-bottom:15px;
}

.add-button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:7px;
    background:#111;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.add-button:hover{
    background:#333;
}

.cart{
    position:fixed;
    right:-400px;
    top:0;
    width:360px;
    max-width:90%;
    height:100%;
    background:white;
    z-index:2000;
    box-shadow:-4px 0 15px rgba(0,0,0,.25);
    padding:20px;
    transition:.3s;
    overflow-y:auto;
}

.cart.open{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close-cart{
    border:none;
    background:#eee;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
}

.cart-item{
    border-bottom:1px solid #ddd;
    padding:12px 0;
}

.cart-item strong{
    display:block;
    margin-bottom:5px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.quantity button{
    width:28px;
    height:28px;
    border:none;
    background:#111;
    color:white;
    border-radius:4px;
    cursor:pointer;
}

.total{
    font-size:21px;
    font-weight:bold;
    margin:20px 0;
}

.checkout{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#0b8f3c;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.whatsapp{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#25D366;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.info{
    text-align:center;
    padding:40px 20px;
    background:white;
    margin-top:30px;
}

.info h2{
    margin-bottom:12px;
}

.info p{
    margin:8px 0;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:30px;
}

footer a{
    color:white;
    text-decoration:none;
}

@media(max-width:600px){
    .hero h1{
        font-size:30px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        padding:10px;
        gap:10px;
    }

    .product-image{
        height:160px;
    }

    .product-content{
        padding:12px;
    }

    .product h3{
        font-size:15px;
    }

    .price{
        font-size:16px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Erin Enterprises</div>

    <button class="cart-button" onclick="openCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Welcome to Erin Enterprises</h1>

    <p>
        Quality products for everyone — children, ladies, men and more.
    </p>

    <a href="#products" class="shop-button">
        🛍️ Shop Now
    </a>
</section>

<h2 class="section-title" id="products">
    Our Products
</h2>

<section
